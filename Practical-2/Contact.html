<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudentHub - Contact</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f2f2;
}

header{
    background:#003366;
    color:white;
    text-align:center;
    padding:20px;
}

nav{
    text-align:center;
    padding:12px;
}

nav a{
    text-decoration:none;
    margin:12px;
}


main{
    width:50%;
    margin:30px auto;
}

section{
    padding:25px;
    border-radius:8px;
    box-shadow:0 0 10px lightgray;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    font-weight:bold;
}

input, textarea{
    width:100%;
    padding:10px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:5px;
}

textarea{
    resize:none;
}

input[type="submit"]{
    background:#0059b3;
    color:white;
    border:none;
    cursor:pointer;
}


footer{
    text-align:center;
    padding:15px;
    margin-top:30px;
}

</style>

</head>

<body>

<header>
<h1>StudentHub Portal</h1>
<p>Contact Us</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="register.html">Register</a>
<a href="login.html">Login</a>
<a href="dashboard.html">Dashboard</a>

<a href="contact.html">Contact</a>
<a href="admin.html">Admin</a>
<a href="faq.html">FAQ</a>
</nav>

<main>

<section>

<h2>Contact Form</h2>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your name">

<label>Email</label>
<input type="email" placeholder="Enter your email">

<label>Message</label>
<textarea rows="5" placeholder="Enter your message"></textarea>

<input type="submit" value="Send Message">

</form>

</section>

</main>

<footer>
<p>&copy; 2026 StudentHub Portal | Computer Engineering Department</p>
</footer>

</body>
</html>
