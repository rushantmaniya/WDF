<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>StudentHub - Events</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header,
        footer {
            background: #003366;
            color: white;
            text-align: center;
            padding: 15px;
        }

        nav {
            text-align: center;
            padding: 10px;
            background: #ddd;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: black;
        }

        main {
            width: 80%;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        .controls {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <header>
        <h1>StudentHub - Events</h1>
    </header>
    <nav>
            <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html">Contact</a>
        <a href="admin.html">Admin</a>
        <a href="faq.html">FAQ</a>
    </nav>
    <main>
        <h2>Events List</h2>
        <div class="controls">
            <input type="text" id="search" placeholder="Search..." oninput="render()">
            <select id="filter" onchange="render()">
                <option value="">All Venues</option>
                <option value="Seminar Hall">Seminar Hall</option>
                <option value="Computer Lab">Computer Lab</option>
                <option value="College Ground">College Ground</option>
            </select>
            <select id="sort" onchange="render()">
                <option value="date">Sort by Date</option>
                <option value="name">Sort by Name</option>
            </select>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Event</th>
                    <th>Venue</th>
                </tr>
            </thead>
            <tbody id="dataBody"></tbody>
        </table>
        <br>
        <div id="pageControls"></div>
    </main>
    <footer>
        <p>&copy; 2026 StudentHub</p>
    </footer>

    <script>
        let data = [];
        let page = 1;

        fetch('events.json').then(res => res.json()).then(json => {
            data = json;
            render();
        });

        function render() {
            let search = document.getElementById('search').value.toLowerCase();
            let filter = document.getElementById('filter').value;
            let sort = document.getElementById('sort').value;

            // 1. Filter & Search
            let filtered = data.filter(e =>
                e.event.toLowerCase().includes(search) &&
                (filter === "" || e.venue === filter)
            );

            // 2. Sort
            filtered.sort((a, b) => sort === 'name' ? a.event.localeCompare(b.event) : new Date(a.date) - new Date(b.date));

            // 3. Pagination (3 per page)
            let totalPages = Math.ceil(filtered.length / 3) || 1;
            if (page > totalPages) page = totalPages;
            if (page < 1) page = 1;
            let pagedData = filtered.slice((page - 1) * 3, page * 3);

            // 4. Show Data
            let html = "";
            pagedData.forEach(e => {
                html += `<tr><td>${e.displayDate}</td><td>${e.event}</td><td>${e.venue}</td></tr>`;
            });
            document.getElementById('dataBody').innerHTML = html || '<tr><td colspan="3">No records found.</td></tr>';

            // 5. Show Pagination Buttons
            document.getElementById('pageControls').innerHTML = `
                <button onclick="page--; render()" ${page === 1 ? 'disabled' : ''}>Prev</button>
                Page ${page} of ${totalPages}
                <button onclick="page++; render()" ${page === totalPages ? 'disabled' : ''}>Next</button>
            `;
        }
    </script>
</body>

</html>
